[project]
name = "quizmonkey"
version = "0.1.1"
description = "QuizMonkey - a cross-platform custom quiz app"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
# Mobile app dependencies only. The web-only packages (fastapi, uvicorn, ...)
# live in the "web" group below, so `flet build` does not try to bundle them
# for iOS/Android — uvicorn[standard] pulls in httptools, which has no mobile
# wheel and breaks the build.
dependencies = [
    "flet==0.82.0",
    "supabase>=2.31.0",
]

[tool.flet]
org = "com.maxdev"
product = "QuizMonkey"
icon = "src/assets/icon.png"

[tool.flet.app]
path = "src"
module = "main"

[tool.flet.ios]
bundle_id = "com.maxdev.monkeyquiz"
team_id = "W45DGNPZ4Q"
provisioning_profile = "MonkeyQuiz AppStore"
signing_certificate = "Apple Distribution: MAXIMILIAN GELDNER (W45DGNPZ4Q)"
export_method = "app-store"

[tool.flet.ios.info]
NSLocationWhenInUseUsageDescription = "Wird derzeit nicht verwendet."
NSPhotoLibraryUsageDescription = "Wird derzeit nicht verwendet."
NSCameraUsageDescription = "Wird derzeit nicht verwendet."

[dependency-groups]
dev = [
    "flet-desktop>=0.82.0",
]
# The web app (web/). Installed for local dev via `uv sync`, but kept out of
# the mobile build.
web = [
    "fastapi>=0.139.2",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.51.0",
]
